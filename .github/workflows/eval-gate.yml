name: eval-gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to check for a release
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  eval-release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: start1921_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: start1921_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U start1921_test -d start1921_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      HISTORY_AGENT_TEST_POSTGRES_URL: postgresql://start1921_test:test_only@127.0.0.1:5432/start1921_test
      DEEPSEEK_API_KEY: ""
      HISTORY_AGENT_LLM_API_KEY: ""
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          version: "0.13.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure isolated checkout
        run: test ! -e .env
      - name: Install dependencies
        run: uv sync --frozen --extra app --extra vector --group dev
      - name: Tests, including current Golden dataset and PostgreSQL integration
        run: uv run --no-sync pytest -q
      - name: Check packaged application assets
        run: uv run --no-sync python deploy/check_image.py
      - name: Lint
        run: uv run --no-sync ruff check app tests deploy --no-cache
      - name: Type check
        run: uv run --no-sync mypy --cache-dir "${RUNNER_TEMP}/start1921-mypy"
      - name: Frontend syntax and streaming tests
        run: |
          node --check app/history_agent/web/static/app.js
          node --check app/history_agent/web/static/markdown.js
          node --check app/history_agent/web/static/stream.js
          node scripts/test-stream.mjs
