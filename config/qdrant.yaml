# Start from the project root, using scripts/qdrant.ps1.
# Qdrant stores vectors; PostgreSQL stores metadata and the keyword index.
log_level: INFO
telemetry_disabled: true
storage:
  storage_path: ./data/qdrant-service/storage
  snapshots_path: ./data/qdrant-service/snapshots
service:
  host: 127.0.0.1
  http_port: 6333
  grpc_port: 6334
  enable_cors: false
