<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start 1921</title>
  <link rel="icon" href="/assets/favicon.svg?v=1" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-16.png?v=1" sizes="16x16" type="image/png">
  <link rel="icon" href="/assets/favicon-32.png?v=1" sizes="32x32" type="image/png">
  <link rel="icon" href="/assets/favicon.ico?v=1" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=1" sizes="180x180">
  <link rel="stylesheet" href="/app.css?v=multi-session-v18">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="会话列表">
      <div class="sidebar-head">
        <h2 class="sidebar-heading">历史会话</h2>
        <button id="new-session" class="primary new-session-button" type="button" aria-label="新建会话" title="新建会话">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M8 3.2v9.6M3.2 8h9.6" />
          </svg>
        </button>
      </div>
      <div id="session-list" class="session-list" aria-live="polite"></div>
      <button id="load-more-sessions" class="ghost small" type="button" hidden>加载更多</button>
      <div class="sidebar-foot">
        <p id="quota" class="meta"></p>
      </div>
    </aside>
    <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>

    <main class="shell">
      <header class="topbar">
        <div class="topbar-main">
          <button id="sidebar-toggle" class="icon-button" type="button" aria-label="打开会话列表">☰</button>
          <div>
            <p class="eyebrow">LOCAL RESEARCH · 1921—1978</p>
            <h1>start1921</h1>
            <p id="current-title" class="session-title">新会话</p>
            <p class="subtitle">只依据本地史料回答，每条结论都能回到文献与 PDF 页码。</p>
          </div>
        </div>
        <div class="topbar-actions">
          <a class="github-link" href="https://github.com/bibofu/start1921" target="_blank" rel="noopener noreferrer" aria-label="GitHub 仓库" title="GitHub">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
            </svg>
          </a>
        </div>
      </header>

      <div id="cookie-warning" class="banner" hidden>
        浏览器禁用了 Cookie，本页无法保存会话。请允许本站 Cookie 后重试。
      </div>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer">
        <label class="sr-only" for="question">输入历史研究问题</label>
        <textarea id="question" rows="1" maxlength="500" placeholder="输入历史问题，根据史料库回答" required></textarea>
        <button id="send" type="submit">发送</button>
      </form>
    </main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/assets/marked.umd.js" defer></script>
  <script src="/assets/purify.min.js" defer></script>
  <script src="/app.js?v=multi-session-v15" type="module"></script>
</body>
</html>
