<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start 1921</title>
  <link rel="stylesheet" href="/app.css?v=multi-session-v15">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="会话列表">
      <div class="sidebar-head">
        <h2 class="sidebar-heading">历史会话</h2>
        <button id="new-session" class="primary new-session-button" type="button" aria-label="新建会话" title="新建会话">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M8 3.2v9.6M3.2 8h9.6" />
          </svg>
        </button>
      </div>
      <div id="session-list" class="session-list" aria-live="polite"></div>
      <button id="load-more-sessions" class="ghost small" type="button" hidden>加载更多</button>
      <div class="sidebar-foot">
        <p id="quota" class="meta"></p>
      </div>
    </aside>
    <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>

    <main class="shell">
      <header class="topbar">
        <div class="topbar-main">
          <button id="sidebar-toggle" class="icon-button" type="button" aria-label="打开会话列表">☰</button>
          <div>
            <p class="eyebrow">LOCAL RESEARCH · 1921—1978</p>
            <h1>start1921</h1>
            <p id="current-title" class="session-title">新会话</p>
            <p class="subtitle">只依据本地史料回答，每条结论都能回到文献与 PDF 页码。</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="rename-session" class="ghost small" type="button" hidden>重命名</button>
          <button id="delete-session" class="ghost small" type="button" hidden>删除会话</button>
        </div>
      </header>

      <div id="cookie-warning" class="banner" hidden>
        浏览器禁用了 Cookie，本页无法保存会话。请允许本站 Cookie 后重试。
      </div>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer">
        <label class="sr-only" for="question">输入历史研究问题</label>
        <textarea id="question" rows="1" maxlength="500" placeholder="输入历史问题，根据史料库回答" required></textarea>
        <button id="send" type="submit">发送</button>
      </form>
    </main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/assets/marked.umd.js" defer></script>
  <script src="/assets/purify.min.js" defer></script>
  <script src="/app.js?v=multi-session-v14" type="module"></script>
</body>
</html>
